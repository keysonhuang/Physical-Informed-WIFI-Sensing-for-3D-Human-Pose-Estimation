seed: 42

data:
  dataset: person_in_wifi_3d
  root: ./data/person_in_wifi_3d
  window_size: 10
  num_workers: 4
  signal:
    center_frequency_hz: 5640000000.0
    subcarrier_spacing_hz: 625000.0
    num_spatial_channels: 9
    num_subcarriers: 30
    channel_positions_m: null
    sigma_frequency_hz: 6000000.0
  action_map: {}
  environment_map: {}
  default_action_id: 0
  default_environment_id: -1
  action_labels_available: false

model:
  num_actions: 8
  num_joints: 14
  d_model: 64
  num_heads: 8
  encoder_layers: 2
  feedforward_dim: 128
  action_embedding_dim: 128
  num_frequency_bands: 3
  dropout: 0.1
  dynamic_kernel_size: 5
  environment_hidden_dim: 128
  num_environments: 3

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0
  action_loss_weight: 0.0
  domain_loss_weight: 0.0
  contrastive_temperature: 0.07
  lr_step_size: 30
  lr_gamma: 0.5
  checkpoint_dir: ./checkpoints/person_in_wifi_3d
  save_last: true

metrics:
  right_shoulder_index: null
  left_hip_index: null
