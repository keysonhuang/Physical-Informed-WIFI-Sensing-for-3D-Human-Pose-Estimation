name: Test and package source

on:
  push:
    branches: [main]
    paths:
      - "code_3D-WIFI-HPE/**"
      - ".github/workflows/test-and-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code_3D-WIFI-HPE/requirements.txt
      - name: Install dependencies
        working-directory: code_3D-WIFI-HPE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: code_3D-WIFI-HPE
        run: pytest -q
      - name: Build source archive
        run: |
          zip -r wifi-pose-source.zip code_3D-WIFI-HPE \
            -x "*/__pycache__/*" "*/.pytest_cache/*" "*/checkpoints/*" "*/outputs/*"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: wifi-pose-source
          path: wifi-pose-source.zip
          if-no-files-found: error
          retention-days: 30
